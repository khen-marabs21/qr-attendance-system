<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance Check-In</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
    h2 { margin-top: 0; color: #0f172a; text-align: center; font-weight: 600; font-size: 22px; }
    .subject-banner { background: #e0e7ff; color: #4338ca; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; margin-bottom: 20px; font-size: 15px; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; color: #475569; font-weight: 500; font-size: 14px; }
    input, select { width: 100%; padding: 12px 16px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-family: 'Poppins', sans-serif; background: #fff; text-transform: uppercase; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    button { width: 100%; padding: 13px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background-color: #4338ca; }
    #statusMsg { margin-top: 15px; text-align: center; font-weight: 500; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Online Class Check-In</h2>
    <div id="subjectBanner" class="subject-banner">SUBJECT: LOADING...</div>
    
    <form id="attendanceForm">
      <div class="form-group">
        <label for="sectionSelect">Section</label>
        <select id="sectionSelect" required>
          <option value="">-- Select Your Section --</option>
          <option value="OLCA311E056">OLCA311E056</option>
          <option value="OLCA311E055">OLCA311E055</option>
        </select>
      </div>
      <div class="form-group">
        <label for="studentId">Student ID Number</label>
        <input type="text" id="studentId" required placeholder="E.G., CA202412345">
      </div>
      <div class="form-group">
        <label for="studentName">Full Name (Last Name, First Name)</label>
        <input type="text" id="studentName" required placeholder="E.G., Dela Cruz, Juan">
      </div>
      <button type="submit">Submit Attendance</button>
    </form>
    <div id="statusMsg"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionCode = urlParams.get('session');

    if (sessionCode) {
      const subjectPart = sessionCode.split('-')[0];
      document.getElementById('subjectBanner').innerText = `Subject: ${subjectPart}`;
    } else {
      document.getElementById('subjectBanner').innerText = `Subject: Unknown`;
    }

    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const section = document.getElementById('sectionSelect').value;
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const statusMsg = document.getElementById('statusMsg');

      if (!sessionCode || !section) {
        statusMsg.style.color = '#dc2626';
        statusMsg.innerText = 'Please select a section and use a valid QR session.';
        return;
      }

      const response = await fetch('/api/submit-attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionCode, section, studentId, studentName })
      });

      const data = await response.json();
      if (data.success) {
        statusMsg.style.color = '#16a34a';
        statusMsg.innerText = data.message;
        document.getElementById('studentId').value = '';
        document.getElementById('studentName').value = '';
        document.getElementById('sectionSelect').value = '';
      } else {
        statusMsg.style.color = '#dc2626';
        statusMsg.innerText = data.error || 'Submission failed.';
      }
    });
  </script>
</body>
</html>
